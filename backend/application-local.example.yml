# Copy to application-local.yml. This local file is ignored by Git.
# Create an empty utf8mb4 MySQL 8 database before starting the application.
server:
  port: 18080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/accessible_travel?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:travel_app}
    password: ${DB_PASSWORD:}
app:
  admin-username: admin
  admin-password: ${ADMIN_PASSWORD:}
  amap-web-key: ${AMAP_WEB_KEY:}
  amap-mini-key: ${AMAP_MINI_KEY:}
  wechat-app-id: ${WECHAT_APP_ID:}
  wechat-app-secret: ${WECHAT_APP_SECRET:}
  dev-payments-enabled: true
