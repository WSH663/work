spring:
  application:
    name: accessible-travel
  profiles:
    default: dev
  config:
    import: optional:file:./application-local.yml,optional:file:./backend/application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/accessible_travel?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:travel_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
server:
  port: ${PORT:18080}
  error:
    include-message: never
  servlet:
    encoding:
      charset: UTF-8
      force: true
app:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}
  cors-origins: "${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}"
  amap-web-key: ${AMAP_WEB_KEY:}
  amap-mini-key: ${AMAP_MINI_KEY:}
  wechat-app-id: ${WECHAT_APP_ID:}
  wechat-app-secret: ${WECHAT_APP_SECRET:}
  dev-payments-enabled: ${DEV_PAYMENTS_ENABLED:true}
  notifications:
    order-template-id: ${WECHAT_ORDER_TEMPLATE_ID:}
    refund-template-id: ${WECHAT_REFUND_TEMPLATE_ID:}
    withdrawal-template-id: ${WECHAT_WITHDRAWAL_TEMPLATE_ID:}
